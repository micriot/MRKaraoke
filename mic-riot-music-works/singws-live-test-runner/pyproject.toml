[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "singws-live-test-runner"
version = "0.1.0"
description = "Local, operator-confirmed SingWS readiness and test runner"
requires-python = ">=3.14"
dependencies = ["PyQt6>=6.11"]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
